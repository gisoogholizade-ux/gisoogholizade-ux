name: LifeLingo Backend CI
on:
  push:
    paths:
      - 'lifelingo-backend/**'
      - '.github/workflows/lifelingo-backend-ci.yml'
  pull_request:
    paths:
      - 'lifelingo-backend/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifelingo-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -DskipTests compile
