frame.addEventListener('load',()=>{const d=frame.contentDocument,w=frame.contentWindow;if(!d||d.getElementById('cinematicPatch'))return;const style=d.createElement('style');style.id='cinematicPatch';style.textContent=`
.environment{position:relative;overflow:hidden;isolation:isolate;transition:background .5s ease}.environment:before,.environment:after{content:"";position:absolute;pointer-events:none;z-index:-1}.environment:before{inset:0;background:linear-gradient(90deg,transparent,#ffffff08,transparent);transform:translateX(-110%);animation:roomSweep 7s ease-in-out infinite}.environment:after{left:8%;right:8%;bottom:13%;height:4px;background:#ffffff10;box-shadow:0 24px 35px #0008}.npcAvatar{position:relative;z-index:3;animation:npcIdle 2.7s ease-in-out infinite;transform-origin:50% 100%}.npcAvatar:after{content:"";position:absolute;width:80%;height:14px;left:10%;bottom:-22px;border-radius:50%;background:#0007;filter:blur(5px);z-index:-1;animation:shadowIdle 2.7s ease-in-out infinite}.conversation.show .environment{animation:sceneEnter .55s ease both}.conversation.show .bubble{animation:bubbleIn .38s ease both}.cinematic-prop{position:absolute;z-index:2;pointer-events:none;filter:drop-shadow(0 14px 10px #0007)}.cinematic-hand{position:absolute;z-index:5;width:92px;height:48px;border-radius:45% 45% 36% 36%;background:linear-gradient(145deg,#d6a27f,#9a654d);bottom:-55px;left:18%;transform:rotate(-8deg);opacity:0}.cinematic-passport{width:64px;height:88px;border-radius:5px;background:linear-gradient(145deg,#273a70,#121d42);border:2px solid #a99a56;left:23%;bottom:17%;transform:rotate(-8deg);opacity:0}.cinematic-passport:after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:#c9b865;font-size:25px}.cinematic-stamp{width:55px;height:62px;border-radius:8px 8px 3px 3px;background:linear-gradient(#4c4540 0 34%,#7d2424 34%);right:17%;bottom:20%;opacity:0}.cinematic-phone{width:47px;height:82px;border:4px solid #1a1c22;border-radius:9px;background:linear-gradient(#bceeff,#66b8d5);left:21%;bottom:18%;opacity:0}.cinematic-card{width:78px;height:48px;border-radius:7px;background:linear-gradient(135deg,#403e88,#8b6ee5);left:22%;bottom:18%;opacity:0}.cinematic-bag{width:72px;height:70px;border-radius:6px 6px 16px 16px;background:#d9c59a;left:20%;bottom:15%;opacity:0}.cinematic-laptop{width:115px;height:68px;border:5px solid #252a35;border-radius:6px;background:linear-gradient(#6e8cb2,#283b5a);left:12%;bottom:14%;opacity:0}.cinematic-menu{width:80px;height:100px;background:#eee0bb;border:3px solid #6c563b;left:20%;bottom:14%;transform:rotate(-5deg);opacity:0}.cinematic-key{font-size:58px;left:22%;bottom:16%;opacity:0}.environment.cine-passport .cinematic-passport{animation:passportGive 2.2s ease both}.environment.cine-passport .cinematic-hand{animation:handGive 2.2s ease both}.environment.cine-passport .cinematic-stamp{animation:stampMove 2.2s 2.35s ease both}.environment.cine-sim .cinematic-phone,.environment.cine-hotel .cinematic-key,.environment.cine-restaurant .cinematic-menu,.environment.cine-career .cinematic-laptop,.environment.cine-bank .cinematic-card,.environment.cine-supermarket .cinematic-bag{animation:propPresent 1.1s .35s ease both}.environment.cine-taxi{animation:roadMove 4s linear infinite}.environment.cine-doctor{animation:clinicPulse 3s ease-in-out infinite}
@keyframes npcIdle{50%{transform:translateY(-4px) rotate(.4deg)}}@keyframes shadowIdle{50%{transform:scaleX(.9);opacity:.65}}@keyframes roomSweep{0%,55%{transform:translateX(-110%)}80%,100%{transform:translateX(110%)}}@keyframes sceneEnter{from{opacity:.3;transform:scale(1.025)}to{opacity:1;transform:none}}@keyframes bubbleIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes passportGive{0%{opacity:0;transform:translate(-90px,80px) rotate(-18deg)}35%{opacity:1;transform:translate(0,0) rotate(-8deg)}70%,100%{opacity:1;transform:translate(105px,-42px) rotate(2deg)}}@keyframes handGive{0%{opacity:0;transform:translate(-90px,70px) rotate(-15deg)}25%,62%{opacity:1;transform:translate(0,-80px) rotate(-8deg)}100%{opacity:0;transform:translate(-60px,30px)}}@keyframes stampMove{0%{opacity:0;transform:translate(60px,-50px)}35%{opacity:1;transform:translate(0,-55px)}55%{transform:translate(-85px,5px) rotate(-12deg)}68%{transform:translate(-85px,28px) rotate(-12deg)}80%,100%{opacity:1;transform:translate(0,-55px)}}@keyframes propPresent{0%{opacity:0;transform:translateY(65px) rotate(-8deg)}70%,100%{opacity:1;transform:translateY(0) rotate(0)}}@keyframes roadMove{50%{background-position:40px 0}}@keyframes clinicPulse{50%{box-shadow:inset 0 0 45px #9ed8ff18}}@media(prefers-reduced-motion:reduce){.environment:before,.npcAvatar,.npcAvatar:after,.cinematic-prop,.cinematic-hand{animation:none!important;transition:none!important}}
