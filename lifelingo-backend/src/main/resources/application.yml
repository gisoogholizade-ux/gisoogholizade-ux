server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lifelingo}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
lifelingo:
  jwt-secret: ${JWT_SECRET:change-this-development-secret-change-this-development-secret}
  cors-origin: ${CORS_ORIGIN:https://gisoogholizade-ux.github.io}
