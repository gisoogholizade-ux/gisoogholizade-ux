services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lifelingo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - lifelingo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d lifelingo"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /app
    command: mvn spring-boot:run
    volumes:
      - ./:/app
      - maven_cache:/root/.m2
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lifelingo
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-local-secret-change-this-local-secret-123456
      CORS_ORIGIN: https://gisoogholizade-ux.github.io
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  lifelingo_postgres:
  maven_cache:
